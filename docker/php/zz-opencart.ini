; OpenCart on Railway — production PHP settings.
; OpenCart's own installer refuses to run with session.auto_start enabled and
; requires file_uploads, so both are pinned here rather than left to the image.

memory_limit = 256M
max_execution_time = 60
max_input_vars = 5000

file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M

session.auto_start = Off
session.use_only_cookies = On
session.use_trans_sid = Off

default_charset = UTF-8
date.timezone = UTC
expose_php = Off

; Errors go to the container's stderr so `railway logs` shows them; they are
; never rendered into a response on a public storefront.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
