# Railway's edge reaches containers from 100.64.0.0/10 and its own public range
# 152.233.0.0/17, and mod_remoteip walks X-Forwarded-For right to left. Without
# the public range every request is recorded as a rotating Railway proxy address,
# which breaks OpenCart's order/customer IP records and its anti-fraud checks.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 100.64.0.0/10
RemoteIPTrustedProxy 152.233.0.0/17
RemoteIPTrustedProxy fd00::/8
RemoteIPTrustedProxy 127.0.0.0/8

ServerTokens Prod
ServerSignature Off
TraceEnable Off
