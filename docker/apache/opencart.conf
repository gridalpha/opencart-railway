# __PORT__ is replaced by the entrypoint from Railway's $PORT before httpd starts.
<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The installer is removed after a successful install; this is the second lock,
    # so a rebuilt container can never serve the setup wizard.
    <LocationMatch "^/install(/|$)">
        Require all denied
    </LocationMatch>

    # image/ is a symlink onto the volume, and Apache matches <Directory> against
    # the resolved path, so this block has to name the volume — without it the
    # server's default deny answers 403 for every product image.
    # __DATA_DIR__ is replaced by the entrypoint.
    <Directory __DATA_DIR__/image>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 7 days"
        </IfModule>
    </Directory>

    # Dependency-checking health probe, outside the document root so OpenCart's
    # own rewrite rules never see it. Aliased because Railway's healthcheckPath
    # accepts no dots.
    Alias /healthz /var/www/health/healthz.php
    <Directory /var/www/health>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
